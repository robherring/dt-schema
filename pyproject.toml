[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = [
    "scripts/dt-validate",
    "scripts/dt-doc-validate",
    "scripts/dt-mk-schema",
    "scripts/dt-check-compatible",
    "scripts/dt-extract-example",
]

[tool.setuptools_scm]
write_to = "dtschema/version.py"

[tool.setuptools.packages.find]
include = ["dtschema"]

[tool.setuptools.package-data]
dtschema = ["meta-schemas/**/*.yaml", "schemas/**/*.yaml"]

[[tool.setuptools-rust.bins]]
target = "dt-validate"
path = "rust/cli/dt-validate/Cargo.toml"
debug = false
cargo-manifest-args = ["--locked"]
optional = true

[[tool.setuptools-rust.bins]]
target = "dt-doc-validate"
path = "rust/cli/dt-doc-validate/Cargo.toml"
debug = false
cargo-manifest-args = ["--locked"]
optional = true

[[tool.setuptools-rust.bins]]
target = "dt-mk-schema"
path = "rust/cli/dt-mk-schema/Cargo.toml"
debug = false
cargo-manifest-args = ["--locked"]
optional = true

[[tool.setuptools-rust.bins]]
target = "dt-check-compatible"
path = "rust/cli/dt-check-compatible/Cargo.toml"
debug = false
cargo-manifest-args = ["--locked"]
optional = true

[[tool.setuptools-rust.bins]]
target = "dt-extract-example"
path = "rust/cli/dt-extract-example/Cargo.toml"
debug = false
cargo-manifest-args = ["--locked"]
optional = true

[project]
name = "dtschema"
description = "DeviceTree validation schema and tools"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
authors = [
  {name = "Rob Herring", email = "robh@kernel.org"},
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dynamic = ["version"]

dependencies = [
    "ruamel.yaml>0.15.69",
    "jsonschema>=4.18",
    "rfc3987",
    "pylibfdt",
]

[project.scripts]
dt-cmp-schema = "dtschema.cmp_schema:main"
dt-extract-props = "dtschema.extract_props:main"
dtb2py = "dtschema.dtb2py:main"

[project.urls]
Homepage="https://github.com/devicetree-org/dt-schema"
Source="https://github.com/devicetree-org/dt-schema"
